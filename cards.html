<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Card with Farmer Illustration</title>

    <style>
        body {
            background: #f5f5f5;
            padding: 40px;
            font-family: 'Inter', Arial, sans-serif;
        }

        .offer-card {
            width: 330px;
            height: 190px;
            background: linear-gradient(135deg, #ffecef, #fff4f4);
            border-radius: 16px;
            padding: 18px 18px 14px 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* top-left category pill */
        .offer-tag {
            background: #4b4647;
            color: #ffffff;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 12px;
        }

        .offer-title {
            font-size: 17px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.3;
            max-width: 60%;
        }

        .offer-validity {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }

        /* Coupon pill */
        .coupon-pill {
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #ddd;
            width: fit-content;
        }

        .coupon-pill img {
            width: 18px;
            height: 18px;
        }

        /* Farmer illustration (white background removed using blend mode) */
        .offer-image {
            position: absolute;
            right: -10px;
            bottom: -5px;
            width: 160px;
            pointer-events: none;

            /* Remove white background */
            mix-blend-mode: multiply;

            /* Smooth visual look */
            opacity: 0.95;
        }
    </style>
</head>

<body>

    <div class="offer-card">

        <div class="offer-tag">Agro</div>

        <div class="offer-title">
            Save up to ₹500 on Agro Trade
        </div>

        <div class="offer-validity">Valid till 31 Dec</div>

        <div class="coupon-pill">
            <img src="tag-icon.png" alt="">
            OMPOI500
        </div>

        <!-- Use your uploaded farmer image -->
        <img src="1147_indian farmer standing vector.jpg" class="offer-image">

    </div>

</body>

</html>
